server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ontology files can be large; 500 MiB covers even the largest OBO ontologies.
    client_max_body_size 500m;

    # Use Docker's internal DNS so upstream IPs are re-resolved after container
    # restarts rather than being cached at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ELK reasoning can take up to 1 h on large ontologies.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    location /auth/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ols/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: serve index.html for all non-asset requests
    location / {
        try_files $uri $uri/ /index.html;
    }
}
