server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ontology files can be large. The upload endpoint now streams the file
    # straight to MinIO (no in-memory buffering / broker round-trip), so multi-GB
    # uploads are viable; 2g covers the largest OBO ontologies with headroom.
    client_max_body_size 2g;

    # Proxy backend paths to the api service
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ELK reasoning can take up to 1 h on large ontologies.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ols/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these (index-<hash>.js), so a changed build always has a
    # new URL — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router: serve index.html for all non-asset requests.
    # index.html is the ONLY unfingerprinted file and it carries the pointer to
    # the current bundle, so it must be revalidated on every load. Without this
    # a browser heuristically caches it and keeps running the previous build's
    # JS after a redeploy, with no request reaching nginx to reveal it.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
