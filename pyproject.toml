[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontoexplorer"
version = "0.1.0"
description = "A next-generation FAIR ontology repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]",
    "celery[redis]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic-settings>=2.0",
    "py_horned_owl",
    "rdflib",
    "pyoxigraph",
    "minio",
    "httpx",
    "authlib",
    "python-jose[cryptography]",
    "prometheus-fastapi-instrumentator",
    "python-multipart",
    "structlog>=24.0",
    "prometheus-client",
    "lark>=1.2",
    "redis>=6.0",
    "fastembed>=0.3",
    "pgvector>=0.3",
    "anthropic>=0.97",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]",
    "aiosqlite",
    "httpx",
    "ruff>=0.4",
    "mypy>=1.10",
    "fakeredis>=2.35.1",
]

[tool.hatch.build.targets.wheel]
packages = ["ontoexplorer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.anyio]
backend = "asyncio"
