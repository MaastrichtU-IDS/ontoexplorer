# Production overlay — pulls pre-built images from GHCR instead of building
# locally, and drops dev conveniences (--reload, source-tree bind mounts).
#
#   IMAGE_TAG=0.2.0 docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   IMAGE_TAG=0.2.0 docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The target host needs:
#   - docker + docker compose v2
#   - a populated .env (copy from .env.example, set ENVIRONMENT=production,
#     a real JWT_SECRET_KEY, real OAuth client IDs, etc.)
#   - FRONTEND_HOST, MINIO_HOST set to the public hostnames for this deployment
#   - no source tree, no Python toolchain, no Node.
#
# IMAGE_TAG defaults to `latest` if unset — pin to an exact release in prod.

services:
  migrate:
    image: ghcr.io/maastrichtu-ids/ontoexplorer-api:${IMAGE_TAG:-latest}
    build: !reset null
    command: /app/.venv/bin/alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ontoexplorer:ontoexplorer@postgres:5432/ontoexplorer
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: always
    restart: "no"

  api:
    image: ghcr.io/maastrichtu-ids/ontoexplorer-api:${IMAGE_TAG:-latest}
    build: !reset null
    command: uvicorn ontoexplorer.main:create_app --factory --host 0.0.0.0 --port 8000
    # No source bind-mount in prod — the image carries a frozen copy of
    # ontoexplorer/ and alembic/.
    volumes: !override
      - oxigraph-data:/data/oxigraph
      - fastembed-cache:/root/.cache/fastembed
    environment:
      DATABASE_URL: postgresql+asyncpg://ontoexplorer:ontoexplorer@postgres:5432/ontoexplorer
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_PUBLIC_ENDPOINT: "${MINIO_HOST}"
      MINIO_PUBLIC_SECURE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      fuseki:
        condition: service_started
      reasoner-service:
        condition: service_started
    pull_policy: always
    restart: unless-stopped

  worker:
    image: ghcr.io/maastrichtu-ids/ontoexplorer-api:${IMAGE_TAG:-latest}
    build: !reset null
    volumes: !override
      - oxigraph-data:/data/oxigraph
      - fastembed-cache:/root/.cache/fastembed
    environment:
      DATABASE_URL: postgresql+asyncpg://ontoexplorer:ontoexplorer@postgres:5432/ontoexplorer
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_PUBLIC_ENDPOINT: "${MINIO_HOST}"
      MINIO_PUBLIC_SECURE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    pull_policy: always
    restart: unless-stopped

  beat:
    image: ghcr.io/maastrichtu-ids/ontoexplorer-api:${IMAGE_TAG:-latest}
    build: !reset null
    volumes: !override
      - oxigraph-data:/data/oxigraph
    environment:
      DATABASE_URL: postgresql+asyncpg://ontoexplorer:ontoexplorer@postgres:5432/ontoexplorer
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    pull_policy: always
    restart: unless-stopped

  reasoner-service:
    image: ghcr.io/maastrichtu-ids/ontoexplorer-reasoner-service:${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    restart: unless-stopped

  minio:
    environment:
      MINIO_SERVER_URL: "https://${MINIO_HOST}"

  frontend:
    image: ghcr.io/maastrichtu-ids/ontoexplorer-frontend:${IMAGE_TAG:-latest}
    build: !reset null
    ports: !override []
    environment:
      VIRTUAL_HOST: "${FRONTEND_HOST}"
      LETSENCRYPT_HOST: "${FRONTEND_HOST}"
      VIRTUAL_PORT: "80"
    depends_on:
      - api
    pull_policy: always
    restart: unless-stopped
