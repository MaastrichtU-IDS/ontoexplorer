services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
      - qlever
    volumes:
      - ./ontoexplorer:/app/ontoexplorer
      - oxigraph-data:/data/oxigraph

  worker:
    build: .
    command: celery -A ontoexplorer.modules.jobs.tasks worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  qlever:
    image: adfreiburg/qlever
    ports:
      - "7001:7001"
    volumes:
      - qlever-data:/data

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ontoexplorer
      POSTGRES_USER: ontoexplorer
      POSTGRES_PASSWORD: ontoexplorer
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  elk-service:
    build: docker/elk-service
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379/2
      CLASSIFICATION_TTL_SECONDS: "2592000"
      JUSTIFICATION_TTL_SECONDS: "604800"
      JUSTIFICATION_TIME_LIMIT_SECONDS: "300"
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail/config.yml:/etc/promtail/config.yml

volumes:
  minio-data:
  qlever-data:
  postgres-data:
  oxigraph-data:
  grafana-data:
