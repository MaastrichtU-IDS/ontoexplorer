services:
  api:
    build: .
    command: uvicorn ontoexplorer.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      OXIGRAPH_READ_ONLY: "true"
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    # Defensive cap so a runaway query can't blow the host. The api itself
    # holds little resident memory; 8 GB is a generous ceiling.
    mem_limit: 8g
    depends_on:
      - postgres
      - redis
      - minio
      - fuseki
      - reasoner-service
    volumes:
      - ./ontoexplorer:/app/ontoexplorer
      - ./alembic:/app/alembic
      - oxigraph-data:/data/oxigraph
      - fastembed-cache:/root/.cache/fastembed

  # Workers split by Oxigraph ACCESS MODE, not by "heavy/light". The embedded
  # pyoxigraph (RocksDB) store allows only ONE read-write opener but any number
  # of read-only (secondary) openers. So:
  #   worker-heavy = the sole READ-WRITE owner: drains the "write" queue
  #     (ingest / reason / load_imports) at concurrency=1 → exactly one process
  #     ever opens the store read-write, eliminating LOCK contention.
  #   worker-light = READ-ONLY (OXIGRAPH_READ_ONLY=true): everything else
  #     (embedding / indexing / profiles / diffs / justification), parallel-safe.
  # Routing is configured in ontoexplorer/modules/jobs/tasks.py via task_routes.
  worker-heavy:
    build: .
    command: celery -A ontoexplorer.modules.jobs.tasks worker --loglevel=info -Q write --concurrency=1 -n write@%h
    env_file: .env
    environment:
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
      OMP_NUM_THREADS: "4"
      ONNXRUNTIME_NUM_THREADS: "4"
    mem_limit: 24g
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./ontoexplorer:/app/ontoexplorer
      - oxigraph-data:/data/oxigraph
      - fastembed-cache:/root/.cache/fastembed

  worker-light:
    build: .
    command: celery -A ontoexplorer.modules.jobs.tasks worker --loglevel=info -Q light --concurrency=12 -n read@%h
    env_file: .env
    environment:
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
      # Open Oxigraph read-only (RocksDB secondary) so this worker never contends
      # with the single read-write writer (worker-heavy) for the store LOCK.
      OXIGRAPH_READ_ONLY: "true"
      OMP_NUM_THREADS: "2"
      ONNXRUNTIME_NUM_THREADS: "2"
    mem_limit: 16g
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./ontoexplorer:/app/ontoexplorer
      - oxigraph-data:/data/oxigraph
      - fastembed-cache:/root/.cache/fastembed

  beat:
    build: .
    command: celery -A ontoexplorer.modules.jobs.tasks beat --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./ontoexplorer:/app/ontoexplorer
      - oxigraph-data:/data/oxigraph

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: "http://minio:9000"

  fuseki:
    image: stain/jena-fuseki
    user: root
    ports:
      - "7001:3030"
    environment:
      ADMIN_PASSWORD: admin
      JVM_ARGS: "-Xmx1g"
    # TDB2 on a named volume. `--mem` was silently non-durable: every restart
    # discarded all FAIR metadata, and nothing re-derives it. Matches the k8s
    # deployment. `/fuseki` stays the dataset path, so FUSEKI_ENDPOINT is
    # unchanged.
    command: /jena-fuseki/fuseki-server --update --tdb2 --loc /fuseki-data /fuseki
    volumes:
      - fuseki-data:/fuseki-data

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ontoexplorer
      POSTGRES_USER: ontoexplorer
      POSTGRES_PASSWORD: ontoexplorer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoexplorer -d ontoexplorer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  reasoner-service:
    build: docker/reasoner-service
    platform: linux/amd64
    # Multiple workers so one long/stuck in-process reasoning call (e.g. a slow
    # or runaway rustdl classification) can't block /health and every other
    # request — which otherwise makes the whole service read as "error" in the
    # admin panel and blocks all reasoners. The cache is Redis-backed (shared),
    # so workers stay consistent. Overrides the Dockerfile CMD for amd64+arm64.
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 4
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379/2
      CLASSIFICATION_TTL_SECONDS: "2592000"
      JUSTIFICATION_TTL_SECONDS: "604800"
      JUSTIFICATION_TIME_LIMIT_SECONDS: "300"
    # Mem cap so OOMs inside the reasoner (classification of 1M+ triple
    # ontologies, or the justification greedy walk on the cl-scale module) get
    # killed by the container's cgroup and restart cleanly via docker — rather
    # than invoking Linux OOM-killer at the host level. Raised from 6 GB to
    # 48 GB on the new 251 GB host so FMA / Mondo / HP / Uberon classify
    # without OOM-kills; this is headroom, not commitment.
    mem_limit: 48g
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail/config.yml:/etc/promtail/config.yml

volumes:
  minio-data:
  postgres-data:
  oxigraph-data:
  grafana-data:
  redis-data:
  fastembed-cache:
  fuseki-data:
