services:
  api:
    build: .
    command: uvicorn ontoexplorer.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      OXIGRAPH_READ_ONLY: "true"
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    depends_on:
      - postgres
      - redis
      - minio
      - fuseki
      - elk-service
    volumes:
      - ./ontoexplorer:/app/ontoexplorer
      - ./alembic:/app/alembic
      - oxigraph-data:/data/oxigraph
      - fastembed-cache:/root/.cache/fastembed

  worker:
    build: .
    command: celery -A ontoexplorer.modules.jobs.tasks worker --loglevel=info --concurrency=1
    env_file: .env
    environment:
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
      OMP_NUM_THREADS: "2"
      ONNXRUNTIME_NUM_THREADS: "2"
    mem_limit: 3g
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./ontoexplorer:/app/ontoexplorer
      - oxigraph-data:/data/oxigraph
      - fastembed-cache:/root/.cache/fastembed

  beat:
    build: .
    command: celery -A ontoexplorer.modules.jobs.tasks beat --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./ontoexplorer:/app/ontoexplorer
      - oxigraph-data:/data/oxigraph

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: "http://minio:9000"

  fuseki:
    image: stain/jena-fuseki
    user: root
    ports:
      - "7001:3030"
    environment:
      ADMIN_PASSWORD: admin
      JVM_ARGS: "-Xmx1g"
    command: /jena-fuseki/fuseki-server --update --mem /fuseki

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ontoexplorer
      POSTGRES_USER: ontoexplorer
      POSTGRES_PASSWORD: ontoexplorer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoexplorer -d ontoexplorer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  elk-service:
    build: docker/elk-service
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379/2
      CLASSIFICATION_TTL_SECONDS: "2592000"
      JUSTIFICATION_TTL_SECONDS: "604800"
      JUSTIFICATION_TIME_LIMIT_SECONDS: "300"
    # Mem cap so OOMs inside the reasoner (whelk on 1M+ triple ontologies,
    # or the justification greedy walk on the cl-scale module) get killed by
    # the container's cgroup and restart cleanly via docker — rather than
    # invoking Linux OOM-killer at the host level (which on a 15 GB box has
    # killed elk-service and brought down other services with it).
    mem_limit: 6g
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail/config.yml:/etc/promtail/config.yml

volumes:
  minio-data:
  postgres-data:
  oxigraph-data:
  grafana-data:
  redis-data:
  fastembed-cache:
