# Keeps the SHA-pinned GitHub Actions current. Actions are pinned to a full
# commit SHA (with the version in a trailing comment) so a moved tag cannot
# change what runs in CI; Dependabot reads those comments and opens PRs that
# bump both the SHA and the comment when a new version ships, so the pins stay
# fresh instead of silently rotting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine action bumps rather than one per action.
      actions:
        patterns: ["*"]
