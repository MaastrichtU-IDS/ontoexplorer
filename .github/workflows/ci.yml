name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight CI run for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (no integration extras)
        run: uv sync --no-dev --frozen
        # `--no-dev` matches what the Dockerfile installs. We add dev tools
        # explicitly below so the lock stays the production source of truth.

      - name: Install dev tooling
        run: uv pip install ruff pytest pytest-asyncio anyio httpx

      - name: Ruff
        run: uv run ruff check ontoexplorer/ tests/

      - name: Pytest (unit only — integration tests need running services)
        # `-m "not slow"` excludes a few tests in tests/unit that download
        # large embedder models or require a writable oxigraph data dir —
        # they're really integration tests living in the wrong directory.
        run: uv run pytest tests/unit -q --maxfail=5 -m "not slow"

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test:run

  docker-build:
    name: Docker build (api image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No push — this job only proves the Dockerfile still resolves.
      # Layer cache speeds up reruns on the same branch.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: ontoexplorer-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
