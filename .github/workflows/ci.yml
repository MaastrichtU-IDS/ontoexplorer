name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight CI run for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        # setup-uv@v8 dropped floating major tags as a supply-chain hardening
        # measure (see release notes for v8.0.0). Pin to an immutable tag.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (no integration extras)
        run: uv sync --no-dev --frozen
        # `--no-dev` matches what the Dockerfile installs. We add dev tools
        # explicitly below so the lock stays the production source of truth.

      - name: Install dev tooling
        run: uv pip install ruff pytest pytest-asyncio anyio httpx

      - name: Ruff
        run: uv run ruff check ontoexplorer/ tests/

      - name: Pytest (unit only — integration tests need running services)
        # `-m "not slow"` excludes a few tests in tests/unit that download
        # large embedder models or require a writable oxigraph data dir —
        # they're really integration tests living in the wrong directory.
        run: uv run pytest tests/unit -q --maxfail=5 -m "not slow"

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test:run

  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ontoexplorer-api
            context: .
            dockerfile: Dockerfile
          - image: ontoexplorer-frontend
            context: .
            dockerfile: docker/frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # No push — this job only proves the Dockerfile still resolves.
      # Layer cache speeds up reruns on the same branch.
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          build-args: |
            GIT_REF=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
