name: E2E (perf, a11y, usability)

# Runs the Playwright suite against a deployed environment. Not on every PR —
# it needs a live target and takes a few minutes — but on demand and nightly so
# regressions in real user-facing performance/accessibility get caught.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target site URL'
        required: false
        default: 'https://ontoexplorer.dev.k8s.semanticscience.org'
      projects:
        description: 'Playwright projects (space-separated: chromium firefox webkit mobile throttled)'
        required: false
        default: 'chromium'
  schedule:
    - cron: '0 4 * * *'  # nightly 04:00 UTC against the dev deployment

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (${{ github.event.inputs.projects || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Browsers + system libs preinstalled; keep in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://ontoexplorer.dev.k8s.semanticscience.org' }}
      E2E_PERF: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps
        run: npm ci

      # Functional gate: a11y blockers, usability, and the core flows (home →
      # ontologies → open → tree on a small ontology, search opens a term, SPARQL
      # editor runs). These are load-tolerant, so a failure here is a real
      # regression and reds the nightly.
      - name: Run E2E (functional — gating)
        run: |
          PROJ=""
          for p in ${{ github.event.inputs.projects || 'chromium' }}; do PROJ="$PROJ --project=$p"; done
          npx playwright test $PROJ \
            e2e/a11y.spec.ts e2e/usability.spec.ts e2e/flows.spec.ts \
            --grep-invert "tree navigation selects a term"

      # Perf budgets and heavy big-ontology tree renders are timing-sensitive on
      # the shared dev cluster — they race background workloads (e.g. embedding),
      # so a breach is often transient load, not a regression. Record the metrics
      # but don't red the nightly on them; watch the trend in the uploaded report.
      - name: Run E2E (perf + heavy — informational)
        continue-on-error: true
        run: |
          PROJ=""
          for p in ${{ github.event.inputs.projects || 'chromium' }}; do PROJ="$PROJ --project=$p"; done
          # Two invocations: all of perf.spec, plus only the heavy big-ontology
          # tree renders from flows. (A single --grep would filter perf.spec's
          # tests out too, since they don't match the flows title.) `|| true` so
          # one failing still records the other's metrics; the step is
          # continue-on-error, so neither reds the nightly.
          npx playwright test $PROJ e2e/perf.spec.ts || true
          npx playwright test $PROJ e2e/flows.spec.ts --grep "tree navigation selects a term" || true

      - name: Aggregate report
        if: always()
        run: node e2e/report.mjs || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: frontend/e2e-report
          retention-days: 14

      - name: Job summary
        if: always()
        run: cat e2e-report/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
