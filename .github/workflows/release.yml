name: Release

# Tag a commit on main with a semver string (`0.2.0`, `v0.2.1`, …) to publish
# a versioned set of OCI images to GHCR. The companion `docker-compose.prod.yml`
# overlay pulls these images on the target server — no source tree or build
# toolchain required there.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# `packages: write` is the GHCR push grant. `contents: read` is the default
# checkout grant. Everything else is denied.
permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Root image is used by the api, worker, and beat services — same
          # codebase, different `command:` in docker-compose.
          - image: ontoexplorer-api
            context: .
            dockerfile: Dockerfile
          - image: ontoexplorer-elk-service
            context: docker/elk-service
            dockerfile: docker/elk-service/Dockerfile
          # Context is repo root so docker/frontend/nginx.conf is reachable.
          - image: ontoexplorer-frontend
            context: .
            dockerfile: docker/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Normalize the owner to lowercase — GHCR image paths are case-sensitive
      # on push, and `MaastrichtU-IDS` would otherwise reject. github.repository_owner
      # preserves the original case.
      - name: Lowercase image owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          # `type=semver,pattern={{version}}` strips a leading `v` if present
          # so `v0.2.0` and `0.2.0` both produce `:0.2.0`. The `{{major}}.{{minor}}`
          # form gives a moving `:0.2` tag so consumers can stay on the latest
          # patch within a minor without re-editing compose every release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false   # smaller image, faster push; revisit if attestation matters
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
