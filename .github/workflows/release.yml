name: Release

# Tag a commit on main with a semver string (`0.2.0`, `v0.2.1`, …) to publish
# a versioned set of OCI images to GHCR. The companion `docker-compose.prod.yml`
# overlay pulls these images on the target server — no source tree or build
# toolchain required there.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# `packages: write` is the GHCR push grant. `contents: read` is the default
# checkout grant. Everything else is denied.
permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is not a review gate. `on: push: tags` fires for ANY semver tag from
  # anyone who can push one, including on a commit that never went through a
  # pull request — and the images it produces are what the services repo pins
  # and ArgoCD deploys. Refuse anything that is not already on main.
  guard:
    name: Tag must be on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Refuse a tag that does not descend from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Release tags must be cut from main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main."

  build-and-push:
    name: Build & push ${{ matrix.image }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Root image is used by the api, worker, and beat services — same
          # codebase, different `command:` in docker-compose.
          - image: ontoexplorer-api
            context: .
            dockerfile: Dockerfile
          - image: ontoexplorer-reasoner-service
            context: docker/reasoner-service
            dockerfile: docker/reasoner-service/Dockerfile
          # Context is repo root so docker/frontend/nginx.conf is reachable.
          - image: ontoexplorer-frontend
            context: .
            dockerfile: docker/frontend/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Normalize the owner to lowercase — GHCR image paths are case-sensitive
      # on push, and `MaastrichtU-IDS` would otherwise reject. github.repository_owner
      # preserves the original case.
      - name: Lowercase image owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          # `type=semver,pattern={{version}}` strips a leading `v` if present
          # so `v0.2.0` and `0.2.0` both produce `:0.2.0`. The `{{major}}.{{minor}}`
          # form gives a moving `:0.2` tag so consumers can stay on the latest
          # patch within a minor without re-editing compose every release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GIT_REF=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false   # smaller image, faster push; revisit if attestation matters
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
